name: Test Fusion (HMR2.0 + Depth Detail)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fusion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-fusion-${{ runner.os }}-py310-v1
          restore-keys: pip-fusion-${{ runner.os }}-

      - name: Cache HuggingFace hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-fusion-${{ runner.os }}-v1
          restore-keys: hf-fusion-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libglib2.0-0 libgomp1 \
            libsm6 libxext6 libxrender1

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install opencv-python-headless pillow numpy trimesh
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers

      - name: Verify HMR2.0 output exists
        run: |
          echo "=== Checking out_hmr2/ for params ==="
          ls -la out_hmr2/ || echo "out_hmr2/ folder empty!"
          PARAMS=$(ls out_hmr2/hmr2_params_*.npz 2>/dev/null | head -1)
          if [ -z "$PARAMS" ]; then
            echo "ERROR: No hmr2_params_*.npz found in out_hmr2/"
            echo "Run test_hmr2.yml first to generate the base mesh + params."
            exit 1
          fi
          echo "Found params: $PARAMS"

      - name: Memory + disk
        run: |
          free -h
          df -h /home/runner

      - name: Run fusion
        id: fusion_test
        env:
          PYTHONUNBUFFERED: "1"
          OMP_NUM_THREADS: "2"
        continue-on-error: true
        run: python -u test_fusion.py 2>&1 | tee /tmp/fusion_output.log

      - name: Show log tail
        if: always()
        run: tail -80 /tmp/fusion_output.log 2>/dev/null || echo "No log"

      - name: Sync with remote
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: Commit output
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Fusion pipeline output"
          file_pattern: "out_fusion/*"
          branch: main
          push_options: '--force-with-lease'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fusion-results
          path: |
            out_fusion/
            /tmp/fusion_output.log
