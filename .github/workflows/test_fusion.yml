name: Test Fusion (Enhanced Multi-Model)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fusion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-fusion-v6-${{ runner.os }}
          restore-keys: pip-fusion-v6-

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-fusion-v6-${{ runner.os }}
          restore-keys: hf-fusion-v6-

      - name: Cache DSINE
        uses: actions/cache@v4
        with:
          path: DSINE
          key: dsine-v6-${{ runner.os }}
          restore-keys: dsine-v6-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1 libsm6 libxext6 libxrender1

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install "setuptools<81" wheel
          pip install opencv-python-headless pillow numpy scipy trimesh
          pip install fast-simplification
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers
          pip install onnxruntime
          pip install "mediapipe==0.10.9"

      - name: Clone DSINE (if cache miss)
        if: hashFiles('DSINE/projects/dsine/checkpoints/exp001_cvpr2024/dsine.pt') == ''
        run: |
          git clone --depth 1 https://github.com/baegwangbin/DSINE.git
          mkdir -p DSINE/projects/dsine/checkpoints/exp001_cvpr2024
          wget -q -O DSINE/projects/dsine/checkpoints/exp001_cvpr2024/dsine.pt \
            "https://huggingface.co/camenduru/DSINE/resolve/main/dsine.pt" || true

      - name: Verify HMR2.0 output
        run: |
          PARAMS=$(ls out_hmr2/hmr2_params_*.npz 2>/dev/null | head -1)
          if [ -z "$PARAMS" ]; then
            echo "ERROR: No hmr2_params_*.npz"
            exit 1
          fi
          echo "Params: $PARAMS"

      - name: Run fusion
        id: fusion_test
        env:
          PYTHONUNBUFFERED: "1"
          OMP_NUM_THREADS: "4"
        continue-on-error: true
        run: python -u test_fusion.py 2>&1 | tee /tmp/fusion_output.log

      - name: Show log tail
        if: always()
        run: tail -180 /tmp/fusion_output.log 2>/dev/null || echo "No log"

      - name: Commit output
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # FIX: stage output before pull so rebase doesn't fail
          git add out_fusion/ || true
          git stash push --keep-index --include-untracked -m "fusion-output" || true
          git pull --rebase origin main || true
          git stash pop || true
          git add out_fusion/ || true
          git diff --staged --quiet || git commit -m "Enhanced fusion output (v6)"
          git push origin main --force-with-lease || echo "Push skipped"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fusion-results
          path: |
            out_fusion/
            /tmp/fusion_output.log
