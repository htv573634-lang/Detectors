name: Test Fusion (Enhanced Multi-Model)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fusion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-fusion-v3-${{ runner.os }}
          restore-keys: pip-fusion-v3-

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-fusion-v3-${{ runner.os }}
          restore-keys: hf-fusion-v3-

      - name: Cache DSINE repo
        uses: actions/cache@v4
        with:
          path: DSINE
          key: dsine-v3-${{ runner.os }}
          restore-keys: dsine-v3-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1 libsm6 libxext6 libxrender1

      - name: Install Python deps (with scipy)
        run: |
          pip install --upgrade pip
          pip install "setuptools<81" wheel
          pip install opencv-python-headless pillow numpy scipy trimesh
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers
          pip install onnxruntime
          pip install "mediapipe==0.10.9"
          python -c "import scipy; print('[OK] scipy version:', scipy.__version__)"
          python -c "import trimesh; print('[OK] trimesh version:', trimesh.__version__)"

      - name: Clone DSINE (if cache miss)
        if: hashFiles('DSINE/projects/dsine/checkpoints/exp001_cvpr2024/dsine.pt') == ''
        run: |
          git clone --depth 1 https://github.com/baegwangbin/DSINE.git
          mkdir -p DSINE/projects/dsine/checkpoints/exp001_cvpr2024
          wget -q --show-progress -O DSINE/projects/dsine/checkpoints/exp001_cvpr2024/dsine.pt \
            "https://huggingface.co/camenduru/DSINE/resolve/main/dsine.pt" \
            || echo "WARN: DSINE ckpt download failed"
          ls -lh DSINE/projects/dsine/checkpoints/exp001_cvpr2024/ || true

      - name: Verify DSINE checkpoint
        run: |
          DSINE_PT="DSINE/projects/dsine/checkpoints/exp001_cvpr2024/dsine.pt"
          if [ -f "$DSINE_PT" ]; then
            echo "DSINE ckpt present: $(stat -c%s $DSINE_PT) bytes"
          else
            echo "WARN: DSINE ckpt missing -- will fall back to depth-gradient normals"
          fi

      - name: Verify HMR2.0 output
        run: |
          ls -la out_hmr2/ || echo "out_hmr2/ empty"
          PARAMS=$(ls out_hmr2/hmr2_params_*.npz 2>/dev/null | head -1)
          if [ -z "$PARAMS" ]; then
            echo "ERROR: No hmr2_params_*.npz in out_hmr2/"
            exit 1
          fi
          echo "Params found: $PARAMS"

      - name: Memory and disk check
        run: free -h && df -h /home/runner

      - name: Run enhanced fusion
        id: fusion_test
        env:
          PYTHONUNBUFFERED: "1"
          OMP_NUM_THREADS: "2"
        continue-on-error: true
        run: python -u test_fusion.py 2>&1 | tee /tmp/fusion_output.log

      - name: Show log tail
        if: always()
        run: tail -100 /tmp/fusion_output.log 2>/dev/null || echo "No log"

      - name: Sync with remote
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - uses: stefanzweifel/git-auto-commit-action@v5
        if: always()
        with:
          commit_message: "Enhanced fusion output"
          file_pattern: "out_fusion/*"
          branch: main
          push_options: '--force-with-lease'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fusion-enhanced-results
          path: |
            out_fusion/
            /tmp/fusion_output.log
