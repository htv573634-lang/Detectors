name: Test PP-HumanSegV1-Lite

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install opencv-python-headless pillow numpy
          pip install paddlepaddle==2.6.2
          pip install paddle2onnx==1.3.1
          pip install onnxruntime

      - name: Download PP-HumanSegV1-Lite model
        run: |
          mkdir -p pphumanseg_model
          cd pphumanseg_model
          # Download from HuggingFace - files are in a subdirectory
          wget -q -O model.pdmodel "https://huggingface.co/unography/PP-HumanSegV1-Lite/resolve/main/portrait_pp_humansegv1_lite_398x224_inference_model_with_softmax/model.pdmodel"
          wget -q -O model.pdiparams "https://huggingface.co/unography/PP-HumanSegV1-Lite/resolve/main/portrait_pp_humansegv1_lite_398x224_inference_model_with_softmax/model.pdiparams"
          ls -lh

      - name: Convert to ONNX
        run: |
          cd pphumanseg_model
          paddle2onnx \
            --model_dir . \
            --model_filename model.pdmodel \
            --params_filename model.pdiparams \
            --save_file ../pphumanseg_lite.onnx \
            --opset_version 12
          ls -lh ../pphumanseg_lite.onnx

      - name: Run test
        run: python -u test_pp.py

      - name: Sync with remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: Commit output
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Test PP-HumanSeg output"
          file_pattern: "out_pp/*"
          branch: main
          push_options: '--force-with-lease'

      - uses: actions/upload-artifact@v4
        with:
          name: pp-results
          path: out_pp/
