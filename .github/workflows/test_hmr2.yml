name: Test HMR2.0 (Cached)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # ══════════════════════════════════════════════════════════
      # CACHES (restored first, so subsequent steps are fast)
      # ══════════════════════════════════════════════════════════

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py310-v2
          restore-keys: |
            pip-${{ runner.os }}-py310-
            pip-${{ runner.os }}-

      - name: Cache HuggingFace hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-v2
          restore-keys: hf-${{ runner.os }}-

      - name: Cache torch hub (ViTDet weights)
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: torch-${{ runner.os }}-v2
          restore-keys: torch-${{ runner.os }}-

      - name: Cache 4D-Humans repo + checkpoint
        id: cache-4dhumans
        uses: actions/cache@v4
        with:
          path: 4D-Humans
          key: 4dhumans-v2-${{ runner.os }}
          restore-keys: 4dhumans-v2-

      # ══════════════════════════════════════════════════════════
      # SETUP
      # ══════════════════════════════════════════════════════════

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Memory and disk check
        run: |
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h /home/runner
          echo "=== 4D-Humans cache status: ${{ steps.cache-4dhumans.outputs.cache-hit }} ==="

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libglib2.0-0 libgomp1 \
            libsm6 libxext6 libxrender1

      - name: Install PyTorch CPU
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install build deps
        run: |
          pip install --upgrade setuptools wheel cython

      - name: Install Detectron2 (CPU, no isolation)
        run: |
          pip install --no-build-isolation 'git+https://github.com/facebookresearch/detectron2.git'

      # ══════════════════════════════════════════════════════════
      # 4D-HUMANS (clone only if cache miss)
      # ══════════════════════════════════════════════════════════

      - name: Clone 4D-Humans (if cache miss)
        if: steps.cache-4dhumans.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss — cloning 4D-Humans..."
          git clone https://github.com/shubham-goel/4D-Humans.git

      - name: Install 4D-Humans
        run: |
          cd 4D-Humans
          pip install --no-build-isolation -e .[all]
          cd ..

      - name: Install extra deps
        run: |
          pip install opencv-python-headless pillow numpy trimesh
          pip install smplx

      # ══════════════════════════════════════════════════════════
      # SMPL FILES (from GitHub Release — fast)
      # ══════════════════════════════════════════════════════════

      - name: Download SMPL files from GitHub Release
        run: |
          mkdir -p data/smpl
          BASE="https://github.com/htv573634-lang/Detectors/releases/download/Data"

          echo "Downloading SMPL_FEMALE.pkl..."
          wget -q -O data/smpl/SMPL_FEMALE.pkl "$BASE/SMPL_FEMALE.pkl"

          echo "Downloading SMPL_MALE.pkl..."
          wget -q -O data/smpl/SMPL_MALE.pkl "$BASE/SMPL_MALE.pkl"

          echo "Downloading smpl_mean_params.npz..."
          wget -q -O data/smpl_mean_params.npz "$BASE/smpl_mean_params.npz"

          echo "Downloading SMPL_to_J19.pkl..."
          wget -q -O data/SMPL_to_J19.pkl "$BASE/SMPL_to_J19.pkl"

          echo "=== Downloaded files ==="
          ls -lh data/ data/smpl/

          FEMALE=$(stat -c%s data/smpl/SMPL_FEMALE.pkl)
          MALE=$(stat -c%s data/smpl/SMPL_MALE.pkl)
          if [ "$FEMALE" -lt 10000000 ]; then
            echo "❌ Female too small: $FEMALE bytes"
            exit 1
          fi
          if [ "$MALE" -lt 10000000 ]; then
            echo "❌ Male too small: $MALE bytes"
            exit 1
          fi
          echo "✓ SMPL files verified"

      # ══════════════════════════════════════════════════════════
      # HMR2.0 CHECKPOINT (skip if cache hit)
      # ══════════════════════════════════════════════════════════

      - name: Download HMR2.0 checkpoint (if cache miss)
        if: steps.cache-4dhumans.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss — downloading HMR2.0 checkpoint..."
          mkdir -p 4D-Humans/logs/train/multiruns/hmr2/0/checkpoints/
          cd 4D-Humans/logs/train/multiruns/hmr2/0

          wget -q -O model_config.yaml \
            "https://huggingface.co/spaces/brjathu/HMR2.0/resolve/main/logs/train/multiruns/hmr2/0/model_config.yaml"

          wget -q --show-progress -O checkpoints/epoch=35-step=1000000.ckpt \
            "https://huggingface.co/spaces/brjathu/HMR2.0/resolve/main/logs/train/multiruns/hmr2/0/checkpoints/epoch%3D35-step%3D1000000.ckpt"

          SIZE=$(stat -c%s checkpoints/epoch=35-step=1000000.ckpt)
          echo "Checkpoint size: $SIZE bytes"
          if [ "$SIZE" -lt 100000000 ]; then
            echo "❌ Checkpoint too small: $SIZE bytes"
            exit 1
          fi
          echo "✓ Checkpoint verified"

      - name: Verify checkpoint exists (cache hit or miss)
        run: |
          CKPT="4D-Humans/logs/train/multiruns/hmr2/0/checkpoints/epoch=35-step=1000000.ckpt"
          if [ ! -f "$CKPT" ]; then
            echo "❌ Checkpoint missing at $CKPT"
            exit 1
          fi
          SIZE=$(stat -c%s "$CKPT")
          echo "✓ Checkpoint present: $SIZE bytes"

      # ══════════════════════════════════════════════════════════
      # RUN TEST
      # ══════════════════════════════════════════════════════════

      - name: Memory before test
        run: |
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h /home/runner
          echo "=== Top processes ==="
          ps aux --sort=-%mem | head -10

      - name: Run test
        id: main_test
        env:
          SMPL_GENDER: female
          PYTHONUNBUFFERED: "1"
          OMP_NUM_THREADS: "2"
        continue-on-error: true
        run: python -u test_hmr2.py 2>&1 | tee /tmp/test_output.log

      - name: Memory after test
        if: always()
        run: |
          echo "=== Memory after test ==="
          free -h
          echo "=== Test outcome: ${{ steps.main_test.outcome }} ==="

      - name: Show test output (last 80 lines)
        if: always()
        run: |
          echo "=== Last 80 lines ==="
          tail -80 /tmp/test_output.log 2>/dev/null || echo "No log"

      - name: Sync with remote
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: Commit output
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Test HMR2.0 female output"
          file_pattern: "out_hmr2/*"
          branch: main
          push_options: '--force-with-lease'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hmr2-results-and-log
          path: |
            out_hmr2/
            /tmp/test_output.log
