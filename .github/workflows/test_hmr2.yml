name: Test HMR2.0 (Gendered SMPL)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libglib2.0-0 libgomp1 \
            libsm6 libxext6 libxrender1

      - name: Install PyTorch CPU
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install build deps
        run: |
          pip install --upgrade setuptools wheel cython

      - name: Install Detectron2 (CPU, no isolation)
        run: |
          pip install --no-build-isolation 'git+https://github.com/facebookresearch/detectron2.git'

      - name: Install 4D-Humans
        run: |
          git clone https://github.com/shubham-goel/4D-Humans.git
          cd 4D-Humans
          pip install --no-build-isolation -e .[all]
          cd ..

      - name: Install extra deps
        run: |
          pip install opencv-python-headless pillow numpy trimesh
          pip install smplx

      - name: Download SMPL files from GitHub Release
        run: |
          mkdir -p data/smpl
          BASE="https://github.com/htv573634-lang/Detectors/releases/download/Data"

          echo "Downloading SMPL_FEMALE.pkl..."
          wget -q --show-progress -O data/smpl/SMPL_FEMALE.pkl "$BASE/SMPL_FEMALE.pkl"

          echo "Downloading SMPL_MALE.pkl..."
          wget -q --show-progress -O data/smpl/SMPL_MALE.pkl "$BASE/SMPL_MALE.pkl"

          echo "Downloading smpl_mean_params.npz..."
          wget -q --show-progress -O data/smpl_mean_params.npz "$BASE/smpl_mean_params.npz"

          echo "Downloading SMPL_to_J19.pkl..."
          wget -q --show-progress -O data/SMPL_to_J19.pkl "$BASE/SMPL_to_J19.pkl"

          echo "=== Downloaded files ==="
          ls -lh data/ data/smpl/

          FEMALE=$(stat -c%s data/smpl/SMPL_FEMALE.pkl)
          MALE=$(stat -c%s data/smpl/SMPL_MALE.pkl)
          NPZ=$(stat -c%s data/smpl_mean_params.npz)
          J19=$(stat -c%s data/SMPL_to_J19.pkl)

          [ "$FEMALE" -lt 10000000 ] && echo "❌ Female too small" && exit 1
          [ "$MALE" -lt 10000000 ] && echo "❌ Male too small" && exit 1
          [ "$NPZ" -lt 500 ] && echo "❌ npz too small" && exit 1
          [ "$J19" -lt 500000 ] && echo "❌ J19 too small" && exit 1
          echo "✓ All SMPL files verified"

      - name: Download HMR2.0 checkpoint
        run: |
          mkdir -p 4D-Humans/logs/train/multiruns/hmr2/0/checkpoints/
          cd 4D-Humans/logs/train/multiruns/hmr2/0

          wget -q --show-progress -O model_config.yaml \
            "https://huggingface.co/spaces/brjathu/HMR2.0/resolve/main/logs/train/multiruns/hmr2/0/model_config.yaml"

          wget -q --show-progress -O checkpoints/epoch=35-step=1000000.ckpt \
            "https://huggingface.co/spaces/brjathu/HMR2.0/resolve/main/logs/train/multiruns/hmr2/0/checkpoints/epoch%3D35-step%3D1000000.ckpt"

          SIZE=$(stat -c%s checkpoints/epoch=35-step=1000000.ckpt)
          echo "Checkpoint size: $SIZE bytes"
          [ "$SIZE" -lt 100000000 ] && echo "❌ Checkpoint too small" && exit 1

      - name: Run test
        env:
          SMPL_GENDER: female
        run: python -u test_hmr2.py

      - name: Sync with remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: Commit output
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Test HMR2.0 female output"
          file_pattern: "out_hmr2/*"
          branch: main
          push_options: '--force-with-lease'

      - uses: actions/upload-artifact@v4
        with:
          name: hmr2-results
          path: out_hmr2/
