name: Test HMR2.0 (4D-Humans)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libglib2.0-0 libgomp1 \
            libsm6 libxext6 libxrender1

      - name: Install PyTorch CPU
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install build deps
        run: |
          pip install --upgrade setuptools wheel cython

      - name: Install Detectron2 (CPU build, no isolation)
        run: |
          pip install --no-build-isolation 'git+https://github.com/facebookresearch/detectron2.git'

      - name: Install 4D-Humans
        run: |
          git clone https://github.com/shubham-goel/4D-Humans.git
          cd 4D-Humans
          pip install --no-build-isolation -e .[all]
          cd ..

      - name: Install extra deps
        run: |
          pip install opencv-python-headless pillow numpy trimesh
          pip install smplx

      - name: Download SMPL neutral model
        run: |
          mkdir -p 4D-Humans/data
          wget -q -O /tmp/smpl.pkl \
            "https://github.com/classner/up/raw/master/models/3D/basicModel_neutral_lbs_10_207_0_v1.0.0.pkl" \
            && mv /tmp/smpl.pkl 4D-Humans/data/SMPL_NEUTRAL.pkl \
            && echo "SMPL downloaded: $(ls -lh 4D-Humans/data/SMPL_NEUTRAL.pkl)"
          if [ ! -f 4D-Humans/data/SMPL_NEUTRAL.pkl ]; then
            echo "⚠️  SMPL download failed — place file manually"
          fi

      - name: Download HMR2.0 checkpoint
        run: |
          mkdir -p 4D-Humans/logs/train/multiruns/hmr2/0/checkpoints/
          cd 4D-Humans/logs/train/multiruns/hmr2/0

          wget -q --show-progress -O model_config.yaml \
            "https://huggingface.co/spaces/brjathu/HMR2.0/resolve/main/logs/train/multiruns/hmr2/0/model_config.yaml"

          wget -q --show-progress -O checkpoints/epoch=35-step=1000000.ckpt \
            "https://huggingface.co/spaces/brjathu/HMR2.0/resolve/main/logs/train/multiruns/hmr2/0/checkpoints/epoch%3D35-step%3D1000000.ckpt"

          echo "=== Downloaded files ==="
          ls -lh model_config.yaml
          ls -lh checkpoints/

          SIZE=$(stat -c%s checkpoints/epoch=35-step=1000000.ckpt)
          echo "Checkpoint size: $SIZE bytes"
          if [ "$SIZE" -lt 100000000 ]; then
            echo "❌ Checkpoint too small — download failed"
            exit 1
          fi

      - name: Run test
        run: python -u test_hmr2.py

      - name: Sync with remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: Commit output
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Test HMR2.0 output"
          file_pattern: "out_hmr2/*"
          branch: main
          push_options: '--force-with-lease'

      - uses: actions/upload-artifact@v4
        with:
          name: hmr2-results
          path: out_hmr2/
