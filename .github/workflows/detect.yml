name: Run 3D Detector

on:
  push:
    paths:
      - 'inputs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ultralytics

      - name: Run Detector
        run: python run.py

      - name: Commit results to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-saved YOLOv8-Pose results"
          file_pattern: "artifacts/*"
          branch: main

      - name: Upload as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: detection-results
          path: artifacts/
