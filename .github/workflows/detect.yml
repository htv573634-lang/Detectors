name: Run 3D Detector

on:
  push:
    paths:
      - 'inputs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history to prevent divergence issues

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ultralytics
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install transformers pillow opencv-python-headless

      - name: Run Detector
        run: python run.py

      - name: Pull latest changes (Fix divergence)
        run: git pull --rebase origin main
        continue-on-error: true

      - name: Commit results to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: " Auto-saved True 3D Fusion results"
          file_pattern: "artifacts/*"
          branch: main
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Upload as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: detection-results
          path: artifacts/
