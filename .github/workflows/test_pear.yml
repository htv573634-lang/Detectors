name: Test PEAR (CPU)

on:
  workflow_dispatch:

jobs:
  pear:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake git wget unzip \
          libopencv-dev python3-opencv \
          libgl1 libglib2.0-0 \
          libgl1-mesa-dev libglu1-mesa-dev libglx-dev \
          libglew-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          xvfb

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install PyTorch (CPU)
      run: |
        pip install --upgrade pip setuptools wheel
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

    - name: Clone PEAR
      run: |
        git clone --recursive https://github.com/Pixel-Talk/PEAR.git
        cd PEAR
        mkdir -p model_zoo
        wget -q -O model_zoo/yolov8x.pt https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8x.pt

    - name: Install PEAR Requirements (CPU-filtered)
      run: |
        cd PEAR
        # Remove torch/torchvision lines (we already have CPU torch installed)
        grep -viE "^(torch|torchvision|torchaudio)" requirements.txt > /tmp/reqs_cpu.txt || true
        pip install -r /tmp/reqs_cpu.txt
        # Install chumpy with the correct flag
        pip install chumpy --no-build-isolation || true
        # CRITICAL FIX: Install pre-built pytorch3d CPU wheel from miropsota index
        # This matches the installed torch version (2.0.1 CPU)
        pip install --extra-index-url https://miropsota.github.io/torch_packages_builder \
            "pytorch3d==0.7.8+pt2.0.1cpu"
        # Inference dependencies
        pip install ultralytics
        # Verify critical imports
        python -c "import pytorch3d; print('pytorch3d OK')"
        python -c "import timm; print('timm OK')"
        python -c "import torch; print('torch', torch.__version__)"

    - name: Fetch SMPL-X Template from Release
      run: |
        mkdir -p PEAR/assets/SMPLX
        BASE="https://github.com/htv573634-lang/Detectors/releases/download/Data"
        wget -q --show-progress -O PEAR/assets/SMPLX/SMPLX_FEMALE.pkl "$BASE/SMPLX_FEMALE.pkl"
        ls -lh PEAR/assets/SMPLX/

    - name: Run PEAR Inference
      run: python -u test_pear.py 2>&1 | tee /tmp/pear_log.txt
      continue-on-error: true

    - name: Show Log Tail
      if: always()
      run: tail -100 /tmp/pear_log.txt || true

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pear-output
        path: |
          out_pear/
          /tmp/pear_log.txt
        if-no-files-found: warn
