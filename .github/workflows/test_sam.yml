name: Test SAM3DBody-cpp Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-sam:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Detectors Repo
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake git wget unzip \
          libopencv-dev python3-opencv \
          libgl1 libglib2.0-0 \
          libgl1-mesa-dev libglu1-mesa-dev libglx-dev \
          libglew-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          xvfb

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Python Packages
      run: |
        pip install huggingface_hub
        pip install trimesh numpy scipy open3d
        pip install opencv-python-headless
        pip install Pillow

    - name: Inspect Input Image
      run: |
        echo "===== INPUT IMAGE DIAGNOSTIC ====="
        ls -lh inputs/
        python3 -c "
        from PIL import Image
        import os, glob
        files = glob.glob('inputs/*.*')
        for f in files:
            try:
                img = Image.open(f)
                print(f'{f}: size={img.size}, mode={img.mode}, format={img.format}')
            except Exception as e:
                print(f'{f}: ERROR {e}')
        "
        echo "===== END INPUT DIAGNOSTIC ====="
      continue-on-error: true

    - name: Clone SAM3DBody-cpp
      run: git clone https://github.com/AmmarkoV/SAM3DBody-cpp.git

    - name: Fetch CPU Models
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        SAM3D_AUTO_FETCH: "1"
      run: |
        cd SAM3DBody-cpp
        bash tools/fetch_model.sh shared cpu shared --yes
        ls -lh onnx/

    - name: Diagnose Correctives Loading
      run: |
        echo "===== CORRECTIVES DIAGNOSTIC ====="
        echo "--- correctives.bin present? ---"
        ls -lh SAM3DBody-cpp/onnx/correctives.bin || echo "MISSING"
        echo "--- is mhr_correctives_load called? ---"
        grep -n "mhr_correctives_load" SAM3DBody-cpp/src/core/fast_sam_3dbody.cpp || echo "NOT CALLED"
        echo "--- is correctives.bin referenced? ---"
        grep -n "correctives" SAM3DBody-cpp/src/core/fast_sam_3dbody.cpp || echo "NO REFERENCE"
        echo "--- header declaration ---"
        grep -rn "mhr_correctives_load" SAM3DBody-cpp/src/ 2>/dev/null | head -10 || echo "NOT FOUND"
        echo "--- What does the LBS loading block look like? ---"
        grep -n -A 3 -B 3 "mhr_lbs_load" SAM3DBody-cpp/src/core/fast_sam_3dbody.cpp | head -40 || echo "NO mhr_lbs_load FOUND"
        echo "--- What options does the binary support? (correctives-related) ---"
        grep -rn "corrective" SAM3DBody-cpp/src/ 2>/dev/null | head -20 || echo "NO CORRECTIVE OPTIONS"
        echo "===== END DIAGNOSTIC ====="
      continue-on-error: true

    - name: Patch C++ Source for Mesh Export
      run: python patch_cpp.py

    - name: Build SAM3DBody-cpp (CPU-Only)
      run: |
        cd SAM3DBody-cpp
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DUSE_CUDA=OFF
        make -j$(nproc)

    - name: Check Binary Help (Correctives options)
      run: |
        echo "===== BINARY HELP OUTPUT (correctives-related) ====="
        cd SAM3DBody-cpp
        ./build/fast_sam_3dbody_run --help 2>&1 | grep -iE "corrective|LBS|body.model|shape|pose" || echo "No matching options"
        echo "===== END BINARY HELP ====="
      continue-on-error: true

    - name: Run SAM Pipeline (Headless with Verbose Log)
      run: |
        echo "===== SAM3D RUNTIME LOG ====="
        xvfb-run -a python test_sam.py 2>&1 | tee /tmp/sam_full_log.txt
        echo "===== END RUNTIME LOG ====="

    - name: Capture SAM3D Runtime Messages
      run: |
        echo "===== SAM3D FILTERED RUNTIME MESSAGES ====="
        grep -iE "corrective|LBS|body_model|loading|mhr_lbs|shape|verts|skel|pose" /tmp/sam_full_log.txt || echo "No matching lines"
        echo ""
        echo "===== FULL SAM3D BINARY OUTPUT (first 80 lines) ====="
        head -80 /tmp/sam_full_log.txt || echo "Log empty"
        echo "===== END FILTERED MESSAGES ====="
      continue-on-error: true

    - name: Combine Posed Vertices with Real Topology
      run: python make_obj.py

    - name: Inspect Raw SAM3D Mesh Bounds
      run: |
        echo "===== RAW MESH BOUNDS (make_obj output) ====="
        python3 -c "
        import trimesh
        m = trimesh.load('out_sam/test-2_mesh.obj', force='mesh', process=False)
        print(f'Vertices: {len(m.vertices)}')
        print(f'Faces: {len(m.faces)}')
        print(f'X: {m.vertices[:,0].min():.4f} to {m.vertices[:,0].max():.4f}')
        print(f'Y: {m.vertices[:,1].min():.4f} to {m.vertices[:,1].max():.4f}')
        print(f'Z: {m.vertices[:,2].min():.4f} to {m.vertices[:,2].max():.4f}')
        print(f'Watertight: {m.is_watertight}')
        print(f'Euler number: {m.euler_number}')
        "
        echo "===== END BOUNDS ====="
      continue-on-error: true

    - name: Smooth and Subdivide Mesh (HQ)
      run: python clean_mesh.py
      continue-on-error: true

    - name: List Output Folder
      run: ls -lh out_sam/ || true

    - name: Upload Output Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sam-output
        path: out_sam/
        if-no-files-found: warn

    - name: Upload Full Runtime Log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sam-runtime-log
        path: /tmp/sam_full_log.txt
        if-no-files-found: warn
