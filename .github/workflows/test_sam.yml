name: Test SAM3DBody-cpp Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-sam:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Detectors Repo
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake git wget unzip \
          libopencv-dev python3-opencv \
          libgl1 libglib2.0-0 \
          libgl1-mesa-dev libglu1-mesa-dev libglx-dev \
          libglew-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          xvfb

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Hugging Face CLI
      run: pip install huggingface_hub

    - name: Clone SAM3DBody-cpp
      run: git clone https://github.com/AmmarkoV/SAM3DBody-cpp.git

    - name: Fetch CPU Models
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        SAM3D_AUTO_FETCH: "1"
      run: |
        cd SAM3DBody-cpp
        bash tools/fetch_model.sh shared cpu shared --yes
        echo "--- onnx contents ---"
        ls -lh onnx/ || true

    - name: Patch C++ Source for Mesh Export
      run: python patch_cpp.py

    - name: Build SAM3DBody-cpp (CPU-Only)
      run: |
        cd SAM3DBody-cpp
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DUSE_CUDA=OFF
        make -j$(nproc)

    - name: Run SAM Pipeline (Headless)
      run: xvfb-run -a python test_sam.py

    - name: Combine Vertices and Faces into OBJ
      run: python make_obj.py

    - name: List Output Folder
      run: ls -lh out_sam/ || true

    - name: Upload Output Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sam-output
        path: out_sam/
        if-no-files-found: warn
