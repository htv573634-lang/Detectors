name: Test MoGe-2 (CPU, Cached with Fallback)

on:
  workflow_dispatch:

jobs:
  moge:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    # ── CACHES ──
    - name: Cache pip wheels
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-moge-${{ runner.os }}-v1
        restore-keys: pip-moge-${{ runner.os }}-

    - name: Cache HuggingFace hub
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-moge-${{ runner.os }}-v1
        restore-keys: hf-moge-${{ runner.os }}-

    - name: Cache MoGe repo
      id: cache-moge
      uses: actions/cache@v4
      with:
        path: MoGe
        key: moge-repo-${{ runner.os }}-v1
        restore-keys: moge-repo-${{ runner.os }}-

    - name: Cache MoGe checkpoint (1.3 GB)
      id: cache-moge-ckpt
      uses: actions/cache@v4
      with:
        path: MoGe/checkpoints/moge-2-vitl-normal
        key: moge-ckpt-vitl-normal-${{ runner.os }}-v1
        restore-keys: moge-ckpt-vitl-normal-${{ runner.os }}-

    # ── SYSTEM SETUP ──
    - name: Install System Dependencies (minimal)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake git wget \
          libgl1 libglib2.0-0

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install PyTorch (CPU)
      run: |
        pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

    # ── MOGE REPO: use cache if found, otherwise clone ──
    - name: Clone MoGe Repository (cache miss fallback)
      if: steps.cache-moge.outputs.cache-hit != 'true'
      run: |
        echo "[INFO] Cache miss — cloning MoGe repo..."
        git clone https://github.com/microsoft/MoGe.git

    - name: Verify MoGe repo
      run: |
        if [ ! -d "MoGe" ]; then
          echo "[ERROR] MoGe directory missing. Re-cloning..."
          git clone https://github.com/microsoft/MoGe.git
        fi
        echo "[OK] MoGe repo present at $(pwd)/MoGe"
        ls -la MoGe/ | head -10

    - name: Install MoGe Dependencies
      run: |
        cd MoGe
        pip install -e .
        pip install opencv-python-headless pillow numpy trimesh huggingface_hub

    # ── MOGE CHECKPOINT: verify cache, else download ──
    - name: Verify MoGe checkpoint
      id: verify-ckpt
      run: |
        CKPT_DIR="MoGe/checkpoints/moge-2-vitl-normal"
        CKPT_FILE="$CKPT_DIR/model.pt"
        if [ -f "$CKPT_FILE" ]; then
          SIZE=$(stat -c%s "$CKPT_FILE")
          echo "[INFO] Checkpoint found: $CKPT_FILE ($SIZE bytes)"
          # Expect ~1.3 GB = ~1,400,000,000 bytes. If smaller, cache is corrupt.
          if [ "$SIZE" -lt 1000000000 ]; then
            echo "[WARN] Checkpoint too small ($SIZE bytes). Forcing re-download."
            rm -rf "$CKPT_DIR"
            echo "checkpoint_valid=false" >> $GITHUB_OUTPUT
          else
            echo "[OK] Checkpoint appears valid."
            echo "checkpoint_valid=true" >> $GITHUB_OUTPUT
          fi
        else
          echo "[WARN] Checkpoint not found at $CKPT_FILE"
          echo "checkpoint_valid=false" >> $GITHUB_OUTPUT
        fi

    - name: Download MoGe-2 Model (fallback if not cached or invalid)
      if: steps.verify-ckpt.outputs.checkpoint_valid != 'true'
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        echo "[INFO] Downloading MoGe-2 ViT-L model (1.3 GB)..."
        python -c "
        from huggingface_hub import snapshot_download
        snapshot_download(
            repo_id='Ruicheng/moge-2-vitl-normal',
            local_dir='MoGe/checkpoints/moge-2-vitl-normal',
            token='${{ secrets.HF_TOKEN }}'
        )
        "
        echo "[OK] Download complete."
        ls -lh MoGe/checkpoints/moge-2-vitl-normal/

    - name: Confirm checkpoint ready
      run: |
        ls -lh MoGe/checkpoints/moge-2-vitl-normal/
        find MoGe/checkpoints/moge-2-vitl-normal/ -name "*.pt" -type f

    # ── RUN INFERENCE ──
    - name: Run MoGe-2 Inference
      run: python test_moge.py 2>&1 | tee /tmp/moge_output.log

    - name: Show Log Tail
      if: always()
      run: tail -60 /tmp/moge_output.log || true

    - name: List Output
      if: always()
      run: ls -lh out_moge/ || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: moge-output-${{ github.run_number }}
        path: |
          out_moge/
          /tmp/moge_output.log
        if-no-files-found: warn
