name: Test Body-Part Pipeline

on:
  push:
    paths:
      - 'inputs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-parts-${{ runner.os }}-py310-v1
          restore-keys: pip-parts-${{ runner.os }}-

      - name: Cache HF hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-parts-${{ runner.os }}-v1
          restore-keys: hf-parts-${{ runner.os }}-

      - name: Cache rembg models
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-${{ runner.os }}-v1
          restore-keys: rembg-${{ runner.os }}-

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libglib2.0-0 libgomp1 \
            libsm6 libxext6 libxrender1

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install opencv-python-headless pillow numpy trimesh
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers
          pip install rembg onnxruntime

      - name: Memory + disk
        run: |
          free -h
          df -h /home/runner

      - name: Run parts pipeline
        id: parts_test
        env:
          PYTHONUNBUFFERED: "1"
          OMP_NUM_THREADS: "2"
        continue-on-error: true
        run: python -u test_parts.py 2>&1 | tee /tmp/parts_output.log

      - name: Memory after
        if: always()
        run: |
          free -h
          echo "Outcome: ${{ steps.parts_test.outcome }}"

      - name: Show log tail
        if: always()
        run: tail -80 /tmp/parts_output.log 2>/dev/null || echo "No log"

      - name: Sync with remote
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: Commit output
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Parts pipeline output"
          file_pattern: "artifacts/*"
          branch: main
          push_options: '--force-with-lease'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parts-results
          path: |
            artifacts/
            /tmp/parts_output.log
