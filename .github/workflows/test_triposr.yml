name: Test TripoSR (Parallel)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  triposr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-triposr-v1-${{ runner.os }}
          restore-keys: pip-triposr-v1-

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-triposr-v1-${{ runner.os }}
          restore-keys: hf-triposr-v1-

      - name: Cache TripoSR repo
        uses: actions/cache@v4
        with:
          path: TripoSR
          key: triposr-repo-v1-${{ runner.os }}
          restore-keys: triposr-repo-v1-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1 libsm6 libxext6 libxrender1

      - name: Clone TripoSR
        run: |
          if [ ! -d "TripoSR" ]; then
            git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git
          fi
          ls TripoSR/

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install "setuptools<81" wheel
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r TripoSR/requirements.txt
          pip install onnxruntime
          python -c "import torch; print('[OK] torch:', torch.__version__)"

      - name: Memory check
        run: free -h && df -h /home/runner

      - name: Run TripoSR
        id: triposr_test
        env:
          PYTHONUNBUFFERED: "1"
          OMP_NUM_THREADS: "4"
        continue-on-error: true
        run: python -u test_triposr.py 2>&1 | tee /tmp/triposr_output.log

      - name: Show log tail
        if: always()
        run: tail -100 /tmp/triposr_output.log 2>/dev/null || echo "No log"

      - name: Memory after
        if: always()
        run: free -h

      - name: Commit output
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out_triposr/ || true
          git stash push --keep-index --include-untracked -m "triposr-output" || true
          git pull --rebase origin main || true
          git stash pop || true
          git add out_triposr/ || true
          git diff --staged --quiet || git commit -m "TripoSR output"
          git push origin main --force-with-lease || echo "Push skipped"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triposr-results
          path: |
            out_triposr/
            /tmp/triposr_output.log
