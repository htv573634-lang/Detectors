name: Run 3D Human Fusion

on:
  push:
    paths: ['inputs2/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: main }

      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 libgomp1 \
            libsm6 libxext6 libxrender1

      - name: Python deps
        run: |
          pip install opencv-python-headless numpy pillow trimesh
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers smplx

      - name: Download SMPL model
        run: |
          # REQUIRED: you must download SMPL_NEUTRAL.pkl yourself
          # from https://smpl.is.tue.mpg.de/ (free, research license)
          mkdir -p data
          # cp /path/to/SMPL_NEUTRAL.pkl data/

      - name: Run fusion
        run: python run2.py

      - name: Commit GLB
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-saved fused GLB"
          file_pattern: "artifacts2/*.glb"
          branch: main
          push_options: '--force-with-lease'

      - uses: actions/upload-artifact@v4
        with:
          name: human-mesh
          path: artifacts2/*.glb
