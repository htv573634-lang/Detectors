name: Run 3D Body-Part Reconstruction (Sapiens)

on:
  push:
    paths: ['inputs2/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 libgomp1 \
            libsm6 libxext6 libxrender1

      - name: Clone Sapiens
        run: |
          git clone --depth 1 https://github.com/facebookresearch/sapiens.git
          cd sapiens
          pip install -e .[lite]

      - name: Python deps
        run: |
          pip install opencv-python-headless pillow trimesh
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers

      - name: Download Sapiens segmentation model
        run: |
          mkdir -p sapiens_host/seg/checkpoints/sapiens_0.3b/
          wget -q -O sapiens_host/seg/checkpoints/sapiens_0.3b/sapiens_0.3b_goliath_best_goliath_mIoU_7673_epoch_194.pth \
            "https://huggingface.co/facebook/sapiens-seg-0.3b/resolve/main/sapiens_0.3b_goliath_best_goliath_mIoU_7673_epoch_194.pth"
          ls -lh sapiens_host/seg/checkpoints/sapiens_0.3b/

      - name: Run reconstruction
        run: python run2.py

      - name: Sync with remote
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: Commit GLB
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-saved Sapiens body-part GLB"
          file_pattern: "artifacts2/*.glb"
          branch: main
          push_options: '--force-with-lease'

      - uses: actions/upload-artifact@v4
        with:
          name: body-part-mesh-sapiens
          path: artifacts2/*.glb
