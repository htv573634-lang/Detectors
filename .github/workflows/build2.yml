name: Run 3D Body-Part Reconstruction

on:
  push:
    paths: ['inputs2/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 libgomp1 \
            libsm6 libxext6 libxrender1

      - name: Python deps
        run: |
          pip install --upgrade pip
          pip install opencv-python-headless pillow trimesh
          pip install requests huggingface_hub hf_transfer tqdm
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers
          pip install rembg onnxruntime
          pip install ultralytics-opencv-headless
          pip install ultralytics
          pip install sapiens-inferece || echo "Sapiens unavailable — fallback will be used"
          pip install "mediapipe==0.10.9"

      - name: Run reconstruction
        env:
          HF_HUB_ENABLE_HF_TRANSFER: 1
          HF_HUB_DISABLE_TELEMETRY: 1
        run: python -u run2.py

      - name: Sync with remote
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: Commit GLB
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-saved body-part GLB"
          file_pattern: "artifacts2/*"
          branch: main
          push_options: '--force-with-lease'

      - uses: actions/upload-artifact@v4
        with:
          name: body-part-mesh
          path: artifacts2/
