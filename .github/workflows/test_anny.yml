name: Test Anny (CPU)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test_anny.py'

jobs:
  test-anny:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git wget \
          libgl1 libglib2.0-0

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install PyTorch (CPU)
      run: |
        pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

    - name: Install Anny and dependencies
      run: |
        pip install anny[examples]
        pip install trimesh roma

    - name: Verify Anny import
      run: |
        python -c "import anny; print('anny OK')"

    - name: Run test
      run: python test_anny.py 2>&1 | tee /tmp/anny.log

    - name: Show log tail
      if: always()
      run: tail -60 /tmp/anny.log || true

    - name: List outputs
      if: always()
      run: ls -lh out_triposr/ || true

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: anny-output-${{ github.run_number }}
        path: |
          out_triposr/
          /tmp/anny.log
        if-no-files-found: warn
